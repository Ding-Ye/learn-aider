name: go

on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "go.work"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "agents/**"
      - "go.work"
      - ".github/workflows/go.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        session:
          - s01-minimum-coder-loop
          - s02-wholefile-format
          - s03-editblock-searchreplace
          - s04-unified-diff-format
          - s05-prompt-system
          - s06-inputoutput-commands
          - s07-gitrepo-autocommit
          - s08-repomap-pagerank
          - s09-linter-reflection
          - s10-provider-config-retries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: vet
        run: go vet ./...
        working-directory: agents/${{ matrix.session }}
      - name: build
        run: go build ./...
        working-directory: agents/${{ matrix.session }}
      - name: test
        run: |
          if [ -n "$(find . -name '*_test.go')" ]; then
            go test ./...
          else
            echo "no tests yet for ${{ matrix.session }}"
          fi
        working-directory: agents/${{ matrix.session }}
